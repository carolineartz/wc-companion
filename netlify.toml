[build]
  command = "npm run build"
  publish = "dist"
  functions = "netlify/functions"

[functions]
  # The companion function calls the Anthropic API with web search, which can
  # take longer than the default 10s. Bump if you see timeouts (max 26s on
  # the free tier; higher on paid plans).
  node_bundler = "esbuild"

# CDN-level proxy to ESPN's public scoreboard API, used as a CORS-safe
# fallback when the browser can't call site.api.espn.com directly.
[[redirects]]
  from = "/api/espn/*"
  to = "https://site.api.espn.com/:splat"
  status = 200

# SPA fallback so the single-page app handles all routes.
[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200
