<!-- @dsCard group="B · Broadsheet" -->
<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Bracket node · Broadsheet</title>
    <link rel="stylesheet" href="https://use.typekit.net/nui1pgm.css" />
    <style>
      :root {
        --paper: #f4f1e6;
        --surface: #fbfaf3;
        --ink: #16180f;
        --soft: #6f7164;
        --accent: #c8462f;
        --rule: rgba(22, 24, 15, 0.14);
        --display: "spent-vf", ui-sans-serif, system-ui, sans-serif;
        --sans: "area-variable", ui-sans-serif, system-ui, sans-serif;
        --mono: "calling-code", ui-monospace, "SF Mono", monospace;
      }
      * { box-sizing: border-box; }
      body {
        margin: 0;
        min-height: 100vh;
        display: grid;
        place-items: center;
        padding: 36px;
        font-family: var(--sans);
        color: var(--ink);
        background: var(--paper);
      }
      .node {
        width: 300px;
        background: var(--surface);
        border: 1px solid var(--rule);
        border-left: 3px solid var(--accent);
        border-radius: 3px;
        padding: 9px 13px 10px;
      }
      .tag {
        font-family: var(--mono);
        font-size: 10px;
        letter-spacing: 0.18em;
        text-transform: uppercase;
        color: var(--soft);
        padding-bottom: 7px;
        border-bottom: 1px solid var(--rule);
        margin-bottom: 4px;
      }
      .row {
        display: grid;
        grid-template-columns: 24px 1fr auto;
        align-items: center;
        gap: 10px;
        padding: 7px 0;
      }
      .row + .row { border-top: 1px solid var(--rule); }
      .flag { font-size: 19px; }
      .nm { font-family: var(--display); font-size: 17px; color: var(--soft); }
      .sc { font-family: var(--display); font-weight: 700; font-size: 18px; color: var(--soft); }
      .win .nm { color: var(--ink); font-weight: 700; }
      .win .sc { color: var(--accent); }
      .win .nm::after {
        content: "▸";
        color: var(--accent);
        font-size: 11px;
        margin-left: 7px;
      }
    </style>
  </head>
  <body>
    <div class="node">
      <div class="tag">Round of 16 · Jul 5</div>
      <div class="row win">
        <span class="flag">🇦🇷</span>
        <span class="nm">Argentina</span>
        <span class="sc">2</span>
      </div>
      <div class="row">
        <span class="flag">🇧🇷</span>
        <span class="nm">Brazil</span>
        <span class="sc">1</span>
      </div>
    </div>
  </body>
</html>
