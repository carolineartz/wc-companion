<!-- @dsCard group="A · Floodlit" -->
<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Kit card · Floodlit</title>
    <link rel="stylesheet" href="https://use.typekit.net/nui1pgm.css" />
    <style>
      :root {
        --bg: #07241b;
        --card: #0e3327;
        --fg: #f4f1e6;
        --muted: #c9cfc4;
        --primary: #34c76a;
        --accent: #f2b705;
        --line: rgba(244, 241, 230, 0.13);
        --display: "spent-vf", ui-sans-serif, system-ui, sans-serif;
        --sans: "area-variable", ui-sans-serif, system-ui, sans-serif;
        --mono: "calling-code", ui-monospace, "SF Mono", monospace;
      }
      * { box-sizing: border-box; }
      body {
        margin: 0;
        min-height: 100vh;
        display: grid;
        place-items: center;
        padding: 32px;
        font-family: var(--sans);
        color: var(--fg);
        background:
          radial-gradient(120% 70% at 50% -10%, rgba(52, 199, 106, 0.16), transparent 60%),
          #061d16;
      }
      .card {
        width: 360px;
        background: linear-gradient(180deg, #103a2c, #0c2c21);
        border: 1px solid var(--line);
        border-radius: 18px;
        overflow: hidden;
        box-shadow: 0 24px 60px -24px rgba(0, 0, 0, 0.7);
      }
      .head {
        display: flex;
        align-items: center;
        justify-content: space-between;
        padding: 16px 18px 12px;
      }
      .who { display: flex; align-items: center; gap: 9px; }
      .flag { font-size: 22px; }
      .nat { font-family: var(--display); font-weight: 600; font-size: 16px; }
      .pos {
        font-family: var(--mono);
        font-size: 11px;
        letter-spacing: 0.22em;
        text-transform: uppercase;
        color: var(--muted);
      }
      /* Shirt block — national kit colors (USA: white / navy / red) */
      .shirt {
        margin: 4px 14px 0;
        border-radius: 14px;
        background: linear-gradient(165deg, #ffffff, #e9e9e9);
        color: #0a2240;
        padding: 22px 18px 18px;
        text-align: center;
        position: relative;
      }
      .nameset {
        font-family: var(--display);
        font-weight: 600;
        text-transform: uppercase;
        letter-spacing: 0.2em;
        font-size: 16px;
      }
      .num {
        font-family: var(--display);
        font-weight: 800;
        font-size: 92px;
        line-height: 0.9;
        color: #bf0a30;
        margin-top: 2px;
      }
      .body { padding: 14px 18px 18px; }
      .chips { display: flex; gap: 8px; margin-bottom: 14px; }
      .chip {
        display: inline-flex;
        align-items: center;
        gap: 7px;
        border: 1px solid var(--line);
        background: rgba(255, 255, 255, 0.04);
        border-radius: 999px;
        padding: 7px 11px;
        font-family: var(--mono);
        font-size: 12px;
        letter-spacing: 0.04em;
      }
      .cdot { width: 9px; height: 9px; border-radius: 50%; background: #c8102e; }
      .chev { color: var(--muted); margin-left: 2px; }
      .lead {
        font-family: var(--mono);
        font-size: 10px;
        letter-spacing: 0.24em;
        text-transform: uppercase;
        color: var(--accent);
        margin-bottom: 6px;
      }
      .headline {
        font-family: var(--sans);
        font-size: 14px;
        line-height: 1.5;
        color: rgba(244, 241, 230, 0.92);
      }
    </style>
  </head>
  <body>
    <article class="card">
      <div class="head">
        <span class="who">
          <span class="flag">🇺🇸</span>
          <span class="nat">United States</span>
        </span>
        <span class="pos">Forward · #10</span>
      </div>
      <div class="shirt">
        <div class="nameset">Pulisic</div>
        <div class="num">10</div>
      </div>
      <div class="body">
        <div class="chips">
          <span class="chip"><span class="cdot"></span>AC Milan<span class="chev">›</span></span>
          <span class="chip">Serie A<span class="chev">›</span></span>
        </div>
        <div class="lead">Headline</div>
        <p class="headline">
          Captain and tip of the spear — carries the U.S. attack from the left,
          fresh off a strong club season in Milan.
        </p>
      </div>
    </article>
  </body>
</html>
