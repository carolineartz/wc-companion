<!-- @dsCard group="A · Floodlit" -->
<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Match card · Floodlit</title>
    <link rel="stylesheet" href="https://use.typekit.net/nui1pgm.css" />
    <style>
      :root {
        --bg: #07241b;
        --card: #0e3327;
        --fg: #f4f1e6;
        --muted: #c9cfc4;
        --primary: #34c76a;
        --accent: #f2b705;
        --line: rgba(244, 241, 230, 0.13);
        --display: "spent-vf", ui-sans-serif, system-ui, sans-serif;
        --sans: "area-variable", ui-sans-serif, system-ui, sans-serif;
        --mono: "calling-code", ui-monospace, "SF Mono", monospace;
      }
      * { box-sizing: border-box; }
      body {
        margin: 0;
        min-height: 100vh;
        display: grid;
        place-items: center;
        padding: 32px;
        font-family: var(--sans);
        color: var(--fg);
        background:
          radial-gradient(120% 70% at 50% -10%, rgba(52, 199, 106, 0.16), transparent 60%),
          #061d16;
      }
      .card {
        width: 380px;
        background: linear-gradient(180deg, #103a2c, #0c2c21);
        border: 1px solid var(--line);
        border-radius: 18px;
        padding: 18px 18px 16px;
        box-shadow: 0 24px 60px -24px rgba(0, 0, 0, 0.7);
      }
      .top {
        display: flex;
        align-items: center;
        justify-content: space-between;
        margin-bottom: 14px;
      }
      .stage {
        font-family: var(--mono);
        font-size: 11px;
        letter-spacing: 0.22em;
        text-transform: uppercase;
        color: var(--muted);
      }
      .live {
        display: inline-flex;
        align-items: center;
        gap: 7px;
        font-family: var(--mono);
        font-size: 12px;
        letter-spacing: 0.12em;
        color: var(--accent);
      }
      .dot {
        width: 8px;
        height: 8px;
        border-radius: 50%;
        background: var(--accent);
        box-shadow: 0 0 0 0 rgba(242, 183, 5, 0.6);
        animation: pulse 1.6s infinite;
      }
      @keyframes pulse {
        0% { box-shadow: 0 0 0 0 rgba(242, 183, 5, 0.55); }
        70% { box-shadow: 0 0 0 7px rgba(242, 183, 5, 0); }
        100% { box-shadow: 0 0 0 0 rgba(242, 183, 5, 0); }
      }
      .team {
        display: grid;
        grid-template-columns: 34px 1fr auto;
        align-items: center;
        gap: 12px;
        padding: 9px 0;
      }
      .team + .team { border-top: 1px solid var(--line); }
      .flag { font-size: 26px; line-height: 1; }
      .name {
        font-family: var(--display);
        font-weight: 600;
        font-size: 19px;
        letter-spacing: 0.01em;
      }
      .seed {
        font-family: var(--mono);
        font-size: 11px;
        color: var(--muted);
        letter-spacing: 0.1em;
        display: block;
        margin-top: 1px;
      }
      .score {
        font-family: var(--display);
        font-weight: 700;
        font-size: 30px;
        line-height: 1;
        color: var(--fg);
      }
      .leading .score { color: var(--primary); }
      .leading .name { color: var(--fg); }
      .dim .score { color: var(--muted); }
      .foot {
        display: flex;
        justify-content: space-between;
        align-items: center;
        margin-top: 14px;
        padding-top: 12px;
        border-top: 1px solid var(--line);
        font-family: var(--mono);
        font-size: 11px;
        letter-spacing: 0.08em;
        color: var(--muted);
      }
      .cta { color: var(--primary); }
    </style>
  </head>
  <body>
    <article class="card">
      <div class="top">
        <span class="stage">Group A · Matchday 2</span>
        <span class="live"><span class="dot"></span>LIVE 73'</span>
      </div>
      <div class="team leading">
        <span class="flag">🇲🇽</span>
        <span>
          <span class="name">Mexico</span>
          <span class="seed">MEX · W1 D1</span>
        </span>
        <span class="score">2</span>
      </div>
      <div class="team dim">
        <span class="flag">🇺🇸</span>
        <span>
          <span class="name">United States</span>
          <span class="seed">USA · W1 L1</span>
        </span>
        <span class="score">1</span>
      </div>
      <div class="foot">
        <span>Estadio Azteca · Mexico City</span>
        <span class="cta">Open match ›</span>
      </div>
    </article>
  </body>
</html>
